        .region-bar, .stories-box {

            font: 14px Arial, sans-serif;
        }
        .region-bar { padding: 6px; }
        .region-bar button {
            display: block;
            width: 110px;
            margin: 3px 0;
            padding: 6px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        .region-bar button.active { background: #222; color: #fff; }
        .stories-box {
            width: 260px;
            max-height: calc(100vh - 280px);

            padding: 10px 12px;
        }
        .stories-box h3 { margin: 0 24px 8px 0; font-size: 15px; }
        .stories-box ul { margin: 0; padding-left: 18px; }
        .stories-box li { margin-bottom: 6px; }
        .stories-close {
            float: right;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }
        .stories-city {
        font-weight: bold;
        color: #555;
        margin: 10px 0 4px;
        }

Object.keys(cityMapConfigs).forEach(function(cityKey) {
    var config = cityMapConfigs[cityKey];

    L.choropleth(tmbmap, {
        // Filter feature data so each layer only renders its respective city's wards
        filter: function(feature) {
            var name = feature.properties.AREA_NAME;
            return name && name.indexOf(config.prefix) === 0;
        },
        valueProperty: 'VM',
        scale: ['#ffffff', config.strongestColor], // Gradient from white to strongest city color
        steps: 5,
        mode: 'q', // Quantile mode
        style: {
            color: '#fff',
            weight: 1,
            fillOpacity: 0.85
        },
        onEachFeature: function(feature, layer) {
            var name = feature.properties.AREA_NAME;
            var info = extraInfo[name];
            
            // Store reference for city zooming/bounds calculation
            if (cityLayers[cityKey]) {
                cityLayers[cityKey].push(layer);
            }

            // Title
            var html = '<strong>' + name + '</strong>';

            // --- Tiered VM Box ---
            var vmVal = feature.properties.VM;
            if (vmVal !== undefined && vmVal !== null) {
                var displayVm = typeof vmVal === 'number' 
                    ? vmVal.toLocaleString() 
                    : vmVal;

                html += '<div style="margin:8px 0; padding:8px 12px; background:#f4f6f8; border-left:4px solid ' + config.strongestColor + '; border-radius:0 4px 4px 0;">';
                html += '<div style="font-size:10px; font-weight:600; text-transform:uppercase; color:#666; letter-spacing:0.5px;">Visible Minority Population</div>';
                html += '<div style="font-size:14px; font-weight:bold; color:#222; margin-top:2px;">' + displayVm + '</div>';
                html += '</div>';
            }

            if (info) {
                if (info.councillors) {
                    // Two (or more) councillors, shown side by side
                    html += '<div style="display:flex; gap:8px; margin-top:6px;">';
                    info.councillors.forEach(function(c) {
                        html += '<div style="flex:1; min-width:0;">';
                        if (c.photo) {
                            html += '<img src="' + c.photo.src + '" style="width:100%; display:block;">';
                        }
                        html += '<div style="font-size:12px; font-weight:bold; margin-top:4px;">' + c.name + '</div>';
                        if (c.photo && c.photo.credit) {
                            html += '<div style="font-size:10px; color:#777;">' + c.photo.credit + '</div>';
                        }
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    // Councillor name
                    if (info.councillor) {
                        html += '<br>' + info.councillor;
                    }

                    // Photo and credit
                    if (info.photo) {
                        html += '<br><img src="' + info.photo.src + '" style="width:200px; display:block;">';
                        html += '<div style="font-size:11px; margin-left:20px; color:#555;">' + info.photo.credit + '</div>';
                    }
                }

                // Turnout line
                if (info.turnout) {
                    html += '<p style="margin:8px 0;">' + info.turnout + '</p>';
                }

                // Subheading for the list
                if (info.listtitle) {
                    html += '<div style="font-size:12px; font-weight:bold; color:#555; margin-top:8px;">' + info.listtitle + '</div>';
                }

                // The list
                if (info.list) {
                    html += '<ul style="margin:0; padding-left:20px;">';
                    info.list.forEach(function(item) {
                        html += '<li>' + item + '</li>';
                    });
                    html += '</ul>';
                }
            }

            layer.bindTooltip(name, { sticky: true });
            layer.on({
                mouseover: function() {
                    if (!pinnedHtml) infoBox.update(html);
                },
                mouseout: function() {
                    infoBox.update(pinnedHtml || defaultHtml);
                },
                click: function(e) {
                    L.DomEvent.stopPropagation(e);
                    pinnedHtml = html;
                    infoBox.update(html);
                }
            });
        }
    }).addTo(map);

        var n = f.properties.AREA_NAME;
        return n && n.indexOf(prefix) === 0;
    });
    if (!wards.length) return;

    try {
        var merged = turf.buffer(wards[0], 0.03, { units: 'kilometers' });
        for (var i = 1; i < wards.length; i++) {
            merged = turf.union(merged, turf.buffer(wards[i], 0.03, { units: 'kilometers' }));
        }
        mergedCities.push(merged);
    } catch (err) {
        console.error('Could not outline ' + cityKey, err);
    }

                    L.DomEvent.disableClickPropagation(this._div);
                    L.DomEvent.disableScrollPropagation(this._div);
                    L.DomEvent.on(this._div, 'click', function(e) {
                        if (e.target.classList.contains('stories-close')) storiesBox.hide();
                    });
                    return this._div;
                };

                storiesBox.show = function(key) {
                    var keys = (key === 'all') ? Object.keys(cityConfig) : [key];
                    var html = '<span class="stories-close">&times;</span>';
                    html += '<h3>' + (key === 'all' ? 'All coverage' : cityConfig[key].label + ' coverage') + '</h3>';

                    keys.forEach(function(k) {
                        var cfg = cityConfig[k];
                        if (key === 'all') {
                            html += '<div class="stories-city">' + cfg.label + '</div>';
                        }
                        if (cfg.stories.length) {
                            html += '<ul>';
                            cfg.stories.forEach(function(s) {
                                html += '<li><a href="' + s.url + '" target="_blank" rel="noopener">' + s.title + '</a></li>';
                            });
                            html += '</ul>';
                        } else {
                            html += '<em>Stories coming soon.</em>';
                        }
                    });

                    this._div.innerHTML = html;
                    this._div.style.display = 'block';
                };

                storiesBox.hide = function() {
                    this._div.style.display = 'none';
                    setActive(null);
                };

                // Region buttons (top left, under the zoom buttons)
                var regionBar = L.control({ position: 'topleft' });

                regionBar.onAdd = function() {
                    var div = L.DomUtil.create('div', 'region-bar');
                    L.DomEvent.disableClickPropagation(div);
                    var html = '<button data-city="all">All three</button>';
                    Object.keys(cityConfig).forEach(function(key) {
                        html += '<button data-city="' + key + '">' + cityConfig[key].label + '</button>';
                    });
                    div.innerHTML = html;
                    L.DomEvent.on(div, 'click', function(e) {
                        var key = e.target.getAttribute('data-city');
                        if (!key) return;
                        if (key === 'all') resetRegions(); else selectCity(key);
                    });
                    return div;
                };

                regionBar.addTo(map);
                storiesBox.addTo(map);

                function setActive(key) {
                    document.querySelectorAll('.region-bar button').forEach(function(btn) {
                        btn.classList.toggle('active', btn.getAttribute('data-city') === key);
                    });
                }

                function selectCity(key) {
                    if (!cityBounds[key]) return;
                    map.fitBounds(cityBounds[key], { padding: [30, 30] });
                    storiesBox.show(key);
                    setActive(key);
                }

                function resetRegions() {
                    map.fitBounds(allBounds, { padding: [30, 30] });
                    storiesBox.show('all');
                    setActive('all');
                }

                // Show city labels only when zoomed out, so they don't sit on top of ward shapes
                function updateCityLabels() {
                    var show = map.getZoom() <= LABEL_MAX_ZOOM;
                    Object.keys(cityMarkers).forEach(function(key) {
                        if (show) cityMarkers[key].addTo(map);
                        else map.removeLayer(cityMarkers[key]);
                    });
                }

                map.on('zoomend', updateCityLabels);
                updateCityLabels();
        map.fitBounds(allBounds, { padding: [10, 10] });
